[project]
name = "mitto"
version = "0.1.0"
description = "A Python HTTP client whose traffic matches real Chrome, built on Chromium's network stack."
readme = "README.md"
requires-python = ">=3.12"
# The code is under Apache-2.0, and the table that a Machine is drawn from under CC-BY-SA-3.0, as MACHINE_TABLE_NOTICE says.
license = "Apache-2.0 AND CC-BY-SA-3.0"
license-files = ["LICENSE", "MACHINE_TABLE_NOTICE", "THIRD_PARTY_NOTICES"]
keywords = ["asyncio", "chrome", "chromium", "http", "http-client", "http2", "http3", "quic", "tls"]
# The licence is the SPDX expression above, so no classifier repeats it.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/darionxt/mitto/blob/main/docs/api.md"
Source = "https://github.com/darionxt/mitto"
Issues = "https://github.com/darionxt/mitto/issues"

[dependency-groups]
dev = [
    "aioquic>=1.7.2",
    "auditwheel>=6.8.2; sys_platform == 'linux'",
    "cryptography>=50.0.2",
    "hatchling>=1.33.0",
    "hpack>=4.2.0",
    "hypothesis>=6.170.14",
    "pylsqpack>=1.0.0",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.8",
    "websockets>=17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitto"]

# Puts the native library into the wheel and tags the wheel for the library's Host. See docs/building.md.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "tools/wheel.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RUF", # ruff's own rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = ["E501"] # The formatter handles line length.

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]
