name: Sanitizers

# Not a required check, because it does not run on every pull request.
on:
  pull_request:
    paths:
      - .github/workflows/sanitizers.yml
      - native/**
      - tests/test_core_test_program.py
      - tests/test_page_program.py
      - tools/workspace/**
  push:
    branches: [main]
    paths:
      - .github/workflows/sanitizers.yml
      - native/**
      - tests/test_core_test_program.py
      - tests/test_page_program.py
      - tools/workspace/**
  # A build that has not changed comes from the cache, so that a scheduled run
  # costs little more than the fuzzing, which finds something new each time.
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

jobs:
  native:
    name: Native core, ${{ matrix.config }}
    runs-on: ubuntu-latest
    # The Runtime takes about 65 minutes to build from nothing, and the library under a sanitizer 18 to 26.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # What the job runs, and the libraries that each of those loads.
          - config: asan
            tests: library
            files: mitto_core_test libmitto_core.so html_tokenizer_test libsanitizer_shared_hooks.so
          - config: ubsan
            tests: library
            files: mitto_core_test libmitto_core.so html_tokenizer_test
          - config: fuzz
            tests: fuzz
            files: client_hints_fuzzer cookies_fuzzer request_options_fuzzer session_settings_fuzzer socks5_auth_fuzzer html_tokenizer_fuzzer libsanitizer_shared_hooks.so
          # The Runtime's Page program, which builds without the library.
          - config: runtime-asan
            tests: page
            files: mitto_page libsanitizer_shared_hooks.so
          - config: runtime-ubsan
            tests: page
            files: mitto_page
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # tools/workspace holds the pin of the source export, and this file the list of
      # what is cached, so this key covers both.
      - id: cached-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-core
          key: native-core-${{ matrix.config }}-${{ hashFiles('.github/workflows/sanitizers.yml', 'native/**', 'tools/workspace/**') }}
      - id: tag
        run: echo "tag=$(cat tools/workspace/chromium_tag)" >> "$GITHUB_OUTPUT"
      # What the export compiles to changes only with tools/workspace, so a pull request
      # reuses main's objects and rebuilds only native/. main always builds from nothing,
      # so a mistake in an incremental build cannot go unnoticed there.
      - id: cached-objects
        if: steps.cached-build.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/${{ matrix.config }}
          key: native-objects-${{ matrix.config }}-${{ hashFiles('tools/workspace/**') }}
          lookup-only: ${{ github.event_name != 'pull_request' }}
      - name: Build the native core
        if: steps.cached-build.outputs.cache-hit != 'true'
        env:
          CONFIG: ${{ matrix.config }}
          FILES: ${{ matrix.files }}
        run: |
          set -o pipefail
          uv run tools/workspace/export.py build "$RUNNER_TEMP/export" --config "$CONFIG" | tee "$RUNNER_TEMP/build.log"
          build_dir="$(dirname "$(tail -n 1 "$RUNNER_TEMP/build.log")")"
          mkdir "$RUNNER_TEMP/native-core"
          for file in $FILES; do
            cp "$build_dir/$file" "$RUNNER_TEMP/native-core"
          done
          # Without this a report names no source lines, and the toolchain is not cached.
          cp "$build_dir/../../third_party/llvm-build/Release+Asserts/bin/llvm-symbolizer" "$RUNNER_TEMP/native-core"
      # Before the tests, so that a test that fails does not waste the build.
      - if: steps.cached-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-core
          key: ${{ steps.cached-build.outputs.cache-primary-key }}
      - if: steps.cached-build.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && steps.cached-objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/${{ matrix.config }}
          key: ${{ steps.cached-objects.outputs.cache-primary-key }}
      - name: Run the C test program against a local server
        if: matrix.tests == 'library'
        run: uv run pytest tests/test_core_test_program.py -rs
        env:
          MITTO_CORE_TEST: ${{ runner.temp }}/native-core/mitto_core_test
          ASAN_OPTIONS: detect_leaks=1:external_symbolizer_path=${{ runner.temp }}/native-core/llvm-symbolizer
          UBSAN_OPTIONS: external_symbolizer_path=${{ runner.temp }}/native-core/llvm-symbolizer
      - name: Run html5lib's tokenizer tests
        if: matrix.tests == 'library'
        run: |
          "$RUNNER_TEMP/native-core/html_tokenizer_test" native/test/html5lib_tokenizer native/test/html5lib_tokenizer_failures.txt
        env:
          ASAN_OPTIONS: detect_leaks=1:external_symbolizer_path=${{ runner.temp }}/native-core/llvm-symbolizer
          UBSAN_OPTIONS: external_symbolizer_path=${{ runner.temp }}/native-core/llvm-symbolizer
      - name: Run the Page program's tests
        if: matrix.tests == 'page'
        run: uv run pytest tests/test_page_program.py -rs
        env:
          MITTO_PAGE_PROGRAM: ${{ runner.temp }}/native-core/mitto_page
          ASAN_OPTIONS: detect_leaks=1:external_symbolizer_path=${{ runner.temp }}/native-core/llvm-symbolizer
          UBSAN_OPTIONS: external_symbolizer_path=${{ runner.temp }}/native-core/llvm-symbolizer
      - name: Fuzz the code that reads a Session's settings, a request's options, cookies, a SOCKS5 proxy's answers, client hints and HTML
        if: matrix.tests == 'fuzz'
        run: |
          mkdir "$RUNNER_TEMP/crashes"
          for target in session_settings request_options cookies socks5_auth client_hints html_tokenizer; do
            mkdir "$RUNNER_TEMP/corpus-$target"
            "$RUNNER_TEMP/native-core/${target}_fuzzer" \
              -max_total_time="$FUZZ_SECONDS" \
              -dict="native/test/${target}_fuzzer.dict" \
              -artifact_prefix="$RUNNER_TEMP/crashes/$target-" \
              "$RUNNER_TEMP/corpus-$target" "native/test/${target}_corpus"
          done
        env:
          ASAN_OPTIONS: detect_leaks=1:external_symbolizer_path=${{ runner.temp }}/native-core/llvm-symbolizer
          # A pull request only checks that new code does not fail quickly. The daily run looks harder.
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 60 || 300 }}
      # A run is random, so the input that crashed it is the only way to repeat it.
      - if: failure() && matrix.tests == 'fuzz'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzer-crashes
          path: ${{ runner.temp }}/crashes
          if-no-files-found: ignore
