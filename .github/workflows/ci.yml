name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The nightly run calls these jobs to build from nothing.
  workflow_call:
    inputs:
      from-nothing:
        description: Restore and save no cache, so that each build starts from nothing
        type: boolean
        default: false

permissions:
  contents: read

# A push to a pull request cancels the runs of its earlier commits. A run on main, or in the nightly run, has a group of
# its own, so it is never cancelled and never waits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.runner }}
    # It builds nothing, so the nightly run leaves it out.
    if: ${{ !inputs.from-nothing }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64, macOS arm64 and Windows x64. macos-latest often gets no runner.
        runner: [ubuntu-latest, xcode-27, windows-2025-vs2026]
        # The oldest supported Python and the newest released one.
        python: ["3.12", "3.15"]
    env:
      UV_LOCKED: "1"
    steps:
      # Git for Windows would check text files out with CRLF line ends, and the tests read files as the repository
      # holds them.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

  native:
    name: Native core on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # From nothing, as in the nightly run, the library takes 13 to 42 minutes, the Runtime 58 to 107 more and the tests
    # 9 to 12.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            library: libmitto_core.so
            core-test: mitto_core_test
            page-program: mitto_page
            html-tokenizer-test: html_tokenizer_test
            html-tree-builder-test: html_tree_builder_test
            media-query-test: media_query_test
            environment-python: bin/python
          # The one hosted macOS image with the macOS SDK that Chromium's bots use.
          - runner: xcode-27
            library: libmitto_core.dylib
            core-test: mitto_core_test
            page-program: mitto_page
            # One build step per core. With ninja's default of 5, the Runtime's build took 108 minutes rather than 83.
            runtime-jobs: 3
            html-tokenizer-test: html_tokenizer_test
            html-tree-builder-test: html_tree_builder_test
            media-query-test: media_query_test
            environment-python: bin/python
          # Visual Studio 2026, which Chromium 157 asks for.
          - runner: windows-2025-vs2026
            library: mitto_core.dll
            # The debug information of the DLL and of the program, which the wheel's symbols archive holds.
            symbols: mitto_core.dll.pdb
            core-test: mitto_core_test.exe
            page-program: mitto_page.exe
            page-program-symbols: mitto_page.exe.pdb
            html-tokenizer-test: html_tokenizer_test.exe
            html-tree-builder-test: html_tree_builder_test.exe
            media-query-test: media_query_test.exe
            environment-python: Scripts/python.exe
    env:
      UV_LOCKED: "1"
    defaults:
      run:
        # Git's bash on Windows.
        shell: bash
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # tools/workspace holds the pin of the source export, so this key covers it too. The nightly run neither
      # restores nor saves a cache.
      - id: cached-library
        if: ${{ !inputs.from-nothing }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-core
          key: native-core-${{ matrix.runner }}-${{ hashFiles('native/**', 'tools/workspace/**') }}
      # The Runtime's Page program, from the same files as the library.
      - id: cached-runtime
        if: ${{ !inputs.from-nothing }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/runtime
          key: runtime-${{ matrix.runner }}-${{ hashFiles('native/**', 'tools/workspace/**') }}
      - id: tag
        run: echo "tag=$(cat tools/workspace/chromium_tag)" >> "$GITHUB_OUTPUT"
      # What the export compiles to changes only with tools/workspace, so main and pull requests reuse the build
      # directory that main saved first with it, and rebuild only native/. The nightly run builds from nothing, which
      # shows a mistake in an incremental build.
      - id: cached-objects
        if: steps.cached-library.outputs.cache-hit != 'true' && !inputs.from-nothing
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/mitto
          key: native-objects-${{ matrix.runner }}-${{ hashFiles('tools/workspace/**') }}
      # The same for the Runtime's build directory.
      - id: cached-runtime-objects
        if: steps.cached-runtime.outputs.cache-hit != 'true' && !inputs.from-nothing
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/runtime
          key: runtime-objects-${{ matrix.runner }}-${{ hashFiles('tools/workspace/**') }}
      # A build on Windows needs the Windows SDK that the Engine Release asks for, which the image may lack.
      - if: runner.os == 'Windows' && (steps.cached-library.outputs.cache-hit != 'true' || steps.cached-runtime.outputs.cache-hit != 'true')
        uses: ./.github/actions/install-windows-sdk
      - name: Build the native core
        if: steps.cached-library.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          LIBRARY: ${{ matrix.library }}
          SYMBOLS: ${{ matrix.symbols }}
          CORE_TEST: ${{ matrix.core-test }}
          HTML_TOKENIZER_TEST: ${{ matrix.html-tokenizer-test }}
          MEDIA_QUERY_TEST: ${{ matrix.media-query-test }}
        run: |
          uv run tools/workspace/export.py build "$RUNNER_TEMP/export"
          build_dir="$RUNNER_TEMP/export/chromium-$TAG/src/out/mitto"
          mkdir "$RUNNER_TEMP/native-core"
          for file in $LIBRARY $SYMBOLS $CORE_TEST $HTML_TOKENIZER_TEST $MEDIA_QUERY_TEST; do
            cp "$build_dir/$file" "$RUNNER_TEMP/native-core"
          done
          # The notices of what this library links, which the test of the wheel's notices compares with them.
          uv run python -m tools.workspace.notices host "$build_dir" > "$RUNNER_TEMP/native-core/host-notices.txt"
      # Before the tests, so that a test that fails does not waste the build.
      - if: steps.cached-library.outputs.cache-hit != 'true' && !inputs.from-nothing
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-core
          key: ${{ steps.cached-library.outputs.cache-primary-key }}
      # Only main saves a build directory, the first time it builds with a tools/workspace.
      - if: steps.cached-library.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && steps.cached-objects.outputs.cache-hit != 'true' && !inputs.from-nothing
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/mitto
          key: ${{ steps.cached-objects.outputs.cache-primary-key }}
      # In a build directory of its own beside the library's, which shares the export and the toolchain.
      - name: Build the Runtime
        if: steps.cached-runtime.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          JOBS: ${{ matrix.runtime-jobs }}
          PAGE_PROGRAM: ${{ matrix.page-program }}
          PAGE_PROGRAM_SYMBOLS: ${{ matrix.page-program-symbols }}
          HTML_TREE_BUILDER_TEST: ${{ matrix.html-tree-builder-test }}
        run: |
          uv run tools/workspace/export.py build "$RUNNER_TEMP/export" --config runtime ${JOBS:+--jobs "$JOBS"}
          build_dir="$RUNNER_TEMP/export/chromium-$TAG/src/out/runtime"
          mkdir "$RUNNER_TEMP/runtime"
          for file in $PAGE_PROGRAM $PAGE_PROGRAM_SYMBOLS $HTML_TREE_BUILDER_TEST; do
            cp "$build_dir/$file" "$RUNNER_TEMP/runtime"
          done
      - if: steps.cached-runtime.outputs.cache-hit != 'true' && !inputs.from-nothing
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/runtime
          key: ${{ steps.cached-runtime.outputs.cache-primary-key }}
      - if: steps.cached-runtime.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && steps.cached-runtime-objects.outputs.cache-hit != 'true' && !inputs.from-nothing
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/runtime
          key: ${{ steps.cached-runtime-objects.outputs.cache-primary-key }}
      # The Runtime's HTML tokenizer, which the library does not link.
      - name: Run html5lib's tokenizer tests
        env:
          HTML_TOKENIZER_TEST: ${{ matrix.html-tokenizer-test }}
        run: |
          "$RUNNER_TEMP/native-core/$HTML_TOKENIZER_TEST" native/test/html5lib_tokenizer native/test/html5lib_tokenizer_failures.txt
      # The Runtime's media queries, against the cases of Blink's own tests.
      - name: Run Blink's media query tests
        env:
          MEDIA_QUERY_TEST: ${{ matrix.media-query-test }}
        run: |
          "$RUNNER_TEMP/native-core/$MEDIA_QUERY_TEST"
      # The Runtime's tree builder, on V8's C++ heap as the Page program has it.
      - name: Run html5lib's tree construction tests
        env:
          HTML_TREE_BUILDER_TEST: ${{ matrix.html-tree-builder-test }}
        run: |
          "$RUNNER_TEMP/runtime/$HTML_TREE_BUILDER_TEST" native/test/html5lib_tree native/test/html5lib_tree_failures.txt
      # With the Page program, for the tests below. A release leaves it out.
      - name: Build the wheel
        env:
          MITTO_WHEEL_LIBRARY: ${{ runner.temp }}/native-core/${{ matrix.library }}
          MITTO_WHEEL_PAGE_PROGRAM: ${{ runner.temp }}/runtime/${{ matrix.page-program }}
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.runner }}
          path: ${{ runner.temp }}/dist/mitto-*
          if-no-files-found: error
          # Both files are compressed already.
          compression-level: 0
      # So that this Host's part of THIRD_PARTY_NOTICES can be merged on another Host.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-core/host-notices.txt
          if-no-files-found: error
      # A new environment, with the locked tools and the package from the wheel, so that the
      # tests load the library inside the installed package and import nothing from src/.
      - name: Install the wheel
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/wheel-env
          ENVIRONMENT_PYTHON: ${{ runner.temp }}/wheel-env/${{ matrix.environment-python }}
        run: |
          uv sync --no-install-project
          uv pip install --python "$ENVIRONMENT_PYTHON" "$RUNNER_TEMP"/dist/*.whl
      # The tests of the Page program run the one in the installed package.
      - name: Test the installed wheel
        env:
          MITTO_HOST_NOTICES: ${{ runner.temp }}/native-core/host-notices.txt
          ENVIRONMENT_PYTHON: ${{ runner.temp }}/wheel-env/${{ matrix.environment-python }}
          PAGE_PROGRAM: ${{ matrix.page-program }}
        run: |
          MITTO_WHEEL="$(ls "$RUNNER_TEMP"/dist/*.whl)"
          MITTO_PAGE_PROGRAM="$("$ENVIRONMENT_PYTHON" -c 'import importlib.util, os, sys; print(os.path.join(importlib.util.find_spec("mitto").submodule_search_locations[0], sys.argv[1]))' "$PAGE_PROGRAM")"
          export MITTO_WHEEL MITTO_PAGE_PROGRAM
          "$ENVIRONMENT_PYTHON" -m pytest -rs
      # The C test program opens Pages with the installed Page program beside the library, as the wheel holds them, and
      # kills the processes on each side. Only these tests run it here: the sanitizer builds run its other scenarios.
      - name: Test Pages through the C API
        env:
          ENVIRONMENT_PYTHON: ${{ runner.temp }}/wheel-env/${{ matrix.environment-python }}
          MITTO_CORE_TEST: ${{ runner.temp }}/native-core/${{ matrix.core-test }}
          PAGE_PROGRAM: ${{ matrix.page-program }}
        run: |
          MITTO_PAGE_PROGRAM="$("$ENVIRONMENT_PYTHON" -c 'import importlib.util, os, sys; print(os.path.join(importlib.util.find_spec("mitto").submodule_search_locations[0], sys.argv[1]))' "$PAGE_PROGRAM")"
          export MITTO_PAGE_PROGRAM
          "$ENVIRONMENT_PYTHON" -m pytest -rs tests/test_page_process.py
