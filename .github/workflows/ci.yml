name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64 and macOS arm64. macos-latest often gets no runner.
        runner: [ubuntu-latest, xcode-27]
        # The oldest supported Python and the newest released one.
        python: ["3.12", "3.15"]
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

  native:
    name: Native core on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            library: libmitto_core.so
          # The one hosted macOS image with the macOS SDK that Chromium's bots use.
          - runner: xcode-27
            library: libmitto_core.dylib
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # tools/workspace holds the pin of the source export, so this key covers it too.
      - id: cached-library
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-core
          key: native-core-${{ matrix.runner }}-${{ hashFiles('native/**', 'tools/workspace/**') }}
      - id: tag
        run: echo "tag=$(cat tools/workspace/chromium_tag)" >> "$GITHUB_OUTPUT"
      # What the export compiles to changes only with tools/workspace, so a pull request
      # reuses main's objects and rebuilds only native/. main always builds from nothing,
      # so a mistake in an incremental build cannot go unnoticed there.
      - id: cached-objects
        if: steps.cached-library.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/mitto
          key: native-objects-${{ matrix.runner }}-${{ hashFiles('tools/workspace/**') }}
          lookup-only: ${{ github.event_name != 'pull_request' }}
      - name: Build the native core
        if: steps.cached-library.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          uv run tools/workspace/export.py build "$RUNNER_TEMP/export" | tee "$RUNNER_TEMP/build.log"
          library="$(tail -n 1 "$RUNNER_TEMP/build.log")"
          mkdir "$RUNNER_TEMP/native-core"
          cp "$library" "$RUNNER_TEMP/native-core"
          # The notices of what this library links, which the test of the wheel's notices compares with them.
          uv run python -m tools.workspace.notices host "$(dirname "$library")" > "$RUNNER_TEMP/native-core/host-notices.txt"
      # Before the tests, so that a test that fails does not waste the build.
      - if: steps.cached-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-core
          key: ${{ steps.cached-library.outputs.cache-primary-key }}
      - if: steps.cached-library.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && steps.cached-objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/mitto
          key: ${{ steps.cached-objects.outputs.cache-primary-key }}
      - name: Build the wheel
        env:
          MITTO_WHEEL_LIBRARY: ${{ runner.temp }}/native-core/${{ matrix.library }}
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.runner }}
          path: ${{ runner.temp }}/dist/mitto-*
          if-no-files-found: error
          # Both files are compressed already.
          compression-level: 0
      # So that this Host's part of THIRD_PARTY_NOTICES can be merged on another Host.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-core/host-notices.txt
          if-no-files-found: error
      # A new environment, with the locked tools and the package from the wheel, so that the
      # tests load the library inside the installed package and import nothing from src/.
      - name: Install the wheel
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/wheel-env
        run: |
          uv sync --no-install-project
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" "$RUNNER_TEMP"/dist/*.whl
      - name: Test the installed wheel
        env:
          MITTO_HOST_NOTICES: ${{ runner.temp }}/native-core/host-notices.txt
        run: |
          MITTO_WHEEL="$(ls "$RUNNER_TEMP"/dist/*.whl)"
          export MITTO_WHEEL
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest -rs
