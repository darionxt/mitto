name: CI

on:
  pull_request:
    # ready_for_review starts the full run when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The nightly run calls these jobs to build from nothing.
  workflow_call:
    inputs:
      from-nothing:
        description: Restore and save no cache, so that each build starts from nothing
        type: boolean
        default: false

permissions:
  contents: read

# A push to a pull request cancels the runs of its earlier commits. A run on main, or in the nightly run, has a group of
# its own, so it is never cancelled and never waits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.runner }}
    # It builds nothing, so the nightly run leaves it out.
    if: ${{ !inputs.from-nothing }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64, macOS arm64 and Windows x64. macos-latest often gets no runner. A draft pull request runs Linux
        # only: it is not in the merge queue yet, and macOS and Windows runners are few.
        runner: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "xcode-27", "windows-2025-vs2026"]') }}
        # The oldest supported Python and the newest released one.
        python: ["3.12", "3.15"]
    env:
      UV_LOCKED: "1"
    steps:
      # Git for Windows would check text files out with CRLF line ends, and the tests read files as the repository
      # holds them.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          # A full run by hand saves nothing: its caches would belong to its branch, and outlive the pull request.
          save-cache: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

  # Which run's wheels the native jobs can take for a push that changes nothing but the list of differences of
  # web-platform-tests. That push follows a run whose wheels passed every test, and only the tests of the list can come
  # out otherwise. Whatever this job does not find, it runs everything (docs/building.md, "A push that changes only the
  # list of differences").
  changes:
    name: What the push changes
    # Only a push to a pull request that is ready for review: a draft runs no native job. Only to main, where the checks
    # are required. Not a fork's, whose runs never take another run's artifacts.
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.base_ref == 'main' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.reuse.outputs.run }}
      # The ID of each runner's wheel, as JSON. An ID is of one artifact, whatever is uploaded under its name later.
      wheels: ${{ steps.reuse.outputs.wheels }}
    steps:
      # The merge commit and its parents, without the files' contents: only their names are read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
      - id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          RUNNERS: ubuntu-latest xcode-27 windows-2025-vs2026
        run: |
          list=tests/wpt/differences.json
          everything() {
            echo "Everything runs: $1" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          # With --no-renames and the status, so that moving the list or making it a link counts as more than a change.
          changes_only_the_list() {
            [ "$(git diff --name-status --no-renames "$1" "$2")" = "M"$'\t'"$list" ]
          }
          fetch() {
            git fetch --quiet --depth 2 --filter=blob:none origin "$1"
          }

          # What the push itself changes, from the head before it to the head after it.
          [ "$(git rev-parse HEAD^2)" = "$HEAD_SHA" ] || everything "this run does not merge $HEAD_SHA."
          fetch "$BEFORE" || everything "$BEFORE, the head before the push, is not there to compare with."
          changes_only_the_list "$BEFORE" "$HEAD_SHA" || everything "the push changes more than $list."

          # The last run of this pull request on that head, whatever else has run on it.
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$BEFORE&per_page=100" --jq '
            [.workflow_runs[] | select(.head_repository.full_name == env.GITHUB_REPOSITORY and .head_branch == env.HEAD_REF and any(.pull_requests[]; .number == (env.NUMBER | tonumber)))]
            | max_by(.run_number).id // empty')" || everything "the runs on $BEFORE cannot be listed."
          [ -n "$run" ] || everything "this pull request has no run on $BEFORE."

          # The wheels, by the ID of each. Read before the jobs: a job that is run again in between shows as not passed.
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq '.artifacts[] | select(.expired | not) | "\(.name) \(.id)"')" || everything "the artifacts of run $run cannot be listed."
          wheels=""
          for runner in $RUNNERS; do
            id="$(sed -n "s/^wheel-$runner //p" <<< "$artifacts")"
            [[ "$id" =~ ^[0-9]+$ ]] || everything "run $run no longer has the wheel of $runner."
            wheels+="${wheels:+,}\"$runner\":$id"
          done

          # Each of its native jobs passed, on one commit, which the job's last step names. No job that was skipped can
          # count: it has no steps, and no name with a runner in it.
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" --jq '
            .jobs[] | select(.conclusion == "success") | .name as $job | .steps[]
            | select(.conclusion == "success" and (.name | test("^Passed on [0-9a-f]{40}$")))
            | "\($job) \(.name | ltrimstr("Passed on "))"')" || everything "the jobs of run $run cannot be listed."
          tested=""
          for runner in $RUNNERS; do
            commit="$(sed -n "s/^Native core on $runner //p" <<< "$passed")"
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || everything "run $run did not pass on $runner."
            [ "${tested:-$commit}" = "$commit" ] || everything "run $run passed on more than one commit."
            tested="$commit"
          done

          # They passed on a merge of that head, and what merges now differs from it by the list alone, so main has not
          # moved either, and the workflow that ran then is this one.
          fetch "$tested" || everything "$tested, which run $run passed on, is not there to compare with."
          [ "$(git rev-parse "$tested^2")" = "$BEFORE" ] || everything "run $run passed on $tested, which does not merge $BEFORE."
          changes_only_the_list "$tested" "$GITHUB_SHA" || everything "more than $list differs from what run $run passed on."

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "wheels={$wheels}" >> "$GITHUB_OUTPUT"
          echo "Only $list differs from what run $run passed on, so this run tests its wheels: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" | tee -a "$GITHUB_STEP_SUMMARY"

  # A job for each Host rather than one matrix, so that a Host's web-platform-tests wait for its own native job alone.
  # Each has a matrix of one all the same. GitHub counts a skipped job as a pass of the check of its name, and a job
  # that a condition skips keeps its name as it is written below, with the expression in it. No check that main requires
  # has that name, while a job without a matrix would pass "Native core on ubuntu-latest" whenever it is skipped.
  native-linux:
    name: Native core on ${{ matrix.runner }}
    needs: changes
    # A draft pull request builds nothing: it runs once it is marked ready for review, at the head of the merge queue.
    # Nor does a push that changes only the list of differences, whose wheels the reuse jobs take. Should "changes"
    # fail, or be skipped, this builds as on any other push.
    if: &builds ${{ !cancelled() && !(github.event_name == 'pull_request' && github.event.pull_request.draft) && (needs.changes.result != 'success' || needs.changes.outputs.run == '') }}
    runs-on: ${{ matrix.runner }}
    # From nothing, as in the nightly run, the library takes 13 to 42 minutes, the Runtime 58 to 107 more and the tests
    # 9 to 12.
    timeout-minutes: 240
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            library: libmitto_core.so
            core-test: mitto_core_test
            page-program: mitto_page
            html-tokenizer-test: html_tokenizer_test
            html-tree-builder-test: html_tree_builder_test
            media-query-test: media_query_test
            environment-python: bin/python
    env: &uv-locked
      UV_LOCKED: "1"
    defaults: &bash
      run:
        # Git's bash on Windows.
        shell: bash
    steps: &native-steps
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # As in the Python job.
          save-cache: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
      # tools/workspace holds the pin of the source export, so this key covers it too. The nightly run neither
      # restores nor saves a cache.
      - id: cached-library
        if: ${{ !inputs.from-nothing }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-core
          key: native-core-${{ matrix.runner }}-${{ hashFiles('native/**', 'tools/workspace/**') }}
      # The Runtime's Page program, from the same files as the library.
      - id: cached-runtime
        if: ${{ !inputs.from-nothing }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/runtime
          key: runtime-${{ matrix.runner }}-${{ hashFiles('native/**', 'tools/workspace/**') }}
      - id: tag
        run: echo "tag=$(cat tools/workspace/chromium_tag)" >> "$GITHUB_OUTPUT"
      # On Windows every compile and link command names the image's MSVC by its version: Chromium's
      # build/toolchain/win/setup_toolchain.py turns the directories that vcvarsall.bat sets into -imsvc and -libpath
      # flags. Over a build directory saved with another MSVC, ninja reruns every step, so there the keys of the build
      # directories below also name the MSVC and the image. Linux takes its sysroot from the export, and on macOS the
      # build links Xcode's SDK into the build directory, so their commands name neither and these outputs stay empty.
      - id: toolchain
        if: runner.os == 'Windows' && !inputs.from-nothing
        shell: pwsh
        run: |
          # The Visual Studio 2026 that Chromium's build/vs_toolchain.py finds, and the MSVC that vcvarsall.bat picks.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -version '[18.0,19.0)' -property installationPath
          $msvc = (Get-Content -Raw "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          "msvc=-msvc$msvc" >> $env:GITHUB_OUTPUT
          "image=-image$env:ImageVersion" >> $env:GITHUB_OUTPUT
      # What the export compiles to changes only with tools/workspace, and on Windows with the image, so main and pull
      # requests reuse the build directory that main saved first with them, and rebuild only native/. A run on an image
      # that main has not built on yet starts from main's build directory with the same MSVC, or else from another of
      # main's, and ninja rebuilds what differs. The nightly run builds from nothing, which shows a mistake in an
      # incremental build.
      - id: cached-objects
        if: steps.cached-library.outputs.cache-hit != 'true' && !inputs.from-nothing
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/mitto
          key: native-objects-${{ matrix.runner }}-${{ hashFiles('tools/workspace/**') }}${{ steps.toolchain.outputs.msvc }}${{ steps.toolchain.outputs.image }}
          restore-keys: |
            native-objects-${{ matrix.runner }}-${{ hashFiles('tools/workspace/**') }}${{ steps.toolchain.outputs.msvc }}-
            native-objects-${{ matrix.runner }}-${{ hashFiles('tools/workspace/**') }}
      # The same for the Runtime's build directory.
      - id: cached-runtime-objects
        if: steps.cached-runtime.outputs.cache-hit != 'true' && !inputs.from-nothing
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/runtime
          key: runtime-objects-${{ matrix.runner }}-${{ hashFiles('tools/workspace/**') }}${{ steps.toolchain.outputs.msvc }}${{ steps.toolchain.outputs.image }}
          restore-keys: |
            runtime-objects-${{ matrix.runner }}-${{ hashFiles('tools/workspace/**') }}${{ steps.toolchain.outputs.msvc }}-
            runtime-objects-${{ matrix.runner }}-${{ hashFiles('tools/workspace/**') }}
      # A build on Windows needs the Windows SDK that the Engine Release asks for, which the image may lack.
      - if: runner.os == 'Windows' && (steps.cached-library.outputs.cache-hit != 'true' || steps.cached-runtime.outputs.cache-hit != 'true')
        uses: ./.github/actions/install-windows-sdk
      - name: Build the native core
        if: steps.cached-library.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          LIBRARY: ${{ matrix.library }}
          SYMBOLS: ${{ matrix.symbols }}
          CORE_TEST: ${{ matrix.core-test }}
          HTML_TOKENIZER_TEST: ${{ matrix.html-tokenizer-test }}
          MEDIA_QUERY_TEST: ${{ matrix.media-query-test }}
        run: |
          uv run tools/workspace/export.py build "$RUNNER_TEMP/export"
          build_dir="$RUNNER_TEMP/export/chromium-$TAG/src/out/mitto"
          mkdir "$RUNNER_TEMP/native-core"
          for file in $LIBRARY $SYMBOLS $CORE_TEST $HTML_TOKENIZER_TEST $MEDIA_QUERY_TEST; do
            cp "$build_dir/$file" "$RUNNER_TEMP/native-core"
          done
          # The notices of what this library links, which the test of the wheel's notices compares with them.
          uv run python -m tools.workspace.notices host "$build_dir" > "$RUNNER_TEMP/native-core/host-notices.txt"
      # Before the tests, so that a test that fails does not waste the build. A full run by hand saves nothing: only its
      # own branch could restore it, and it would take room from main's caches.
      - if: steps.cached-library.outputs.cache-hit != 'true' && !inputs.from-nothing && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-core
          key: ${{ steps.cached-library.outputs.cache-primary-key }}
      # Only main saves a build directory, the first time it builds with a tools/workspace, and on Windows with an image:
      # one restored from another image's directory is saved again, under this image's key.
      - if: steps.cached-library.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && steps.cached-objects.outputs.cache-hit != 'true' && !inputs.from-nothing
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/mitto
          key: ${{ steps.cached-objects.outputs.cache-primary-key }}
      # In a build directory of its own beside the library's, which shares the export and the toolchain.
      - name: Build the Runtime
        if: steps.cached-runtime.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          JOBS: ${{ matrix.runtime-jobs }}
          PAGE_PROGRAM: ${{ matrix.page-program }}
          PAGE_PROGRAM_SYMBOLS: ${{ matrix.page-program-symbols }}
          HTML_TREE_BUILDER_TEST: ${{ matrix.html-tree-builder-test }}
        run: |
          uv run tools/workspace/export.py build "$RUNNER_TEMP/export" --config runtime ${JOBS:+--jobs "$JOBS"}
          build_dir="$RUNNER_TEMP/export/chromium-$TAG/src/out/runtime"
          mkdir "$RUNNER_TEMP/runtime"
          for file in $PAGE_PROGRAM $PAGE_PROGRAM_SYMBOLS $HTML_TREE_BUILDER_TEST; do
            cp "$build_dir/$file" "$RUNNER_TEMP/runtime"
          done
      - if: steps.cached-runtime.outputs.cache-hit != 'true' && !inputs.from-nothing && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/runtime
          key: ${{ steps.cached-runtime.outputs.cache-primary-key }}
      - if: steps.cached-runtime.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && steps.cached-runtime-objects.outputs.cache-hit != 'true' && !inputs.from-nothing
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/export/chromium-${{ steps.tag.outputs.tag }}/src/out/runtime
          key: ${{ steps.cached-runtime-objects.outputs.cache-primary-key }}
      # The Runtime's HTML tokenizer, which the library does not link.
      - name: Run html5lib's tokenizer tests
        env:
          HTML_TOKENIZER_TEST: ${{ matrix.html-tokenizer-test }}
        run: |
          "$RUNNER_TEMP/native-core/$HTML_TOKENIZER_TEST" native/test/html5lib_tokenizer native/test/html5lib_tokenizer_failures.txt
      # The Runtime's media queries, against the cases of Blink's own tests.
      - name: Run Blink's media query tests
        env:
          MEDIA_QUERY_TEST: ${{ matrix.media-query-test }}
        run: |
          "$RUNNER_TEMP/native-core/$MEDIA_QUERY_TEST"
      # The Runtime's tree builder, on V8's C++ heap as the Page program has it.
      - name: Run html5lib's tree construction tests
        env:
          HTML_TREE_BUILDER_TEST: ${{ matrix.html-tree-builder-test }}
        run: |
          "$RUNNER_TEMP/runtime/$HTML_TREE_BUILDER_TEST" native/test/html5lib_tree native/test/html5lib_tree_failures.txt
      # With the Page program, for the tests below. A release leaves it out.
      - name: Build the wheel
        env:
          MITTO_WHEEL_LIBRARY: ${{ runner.temp }}/native-core/${{ matrix.library }}
          MITTO_WHEEL_PAGE_PROGRAM: ${{ runner.temp }}/runtime/${{ matrix.page-program }}
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.runner }}
          path: ${{ runner.temp }}/dist/mitto-*
          if-no-files-found: error
          # Both files are compressed already.
          compression-level: 0
      # So that this Host's part of THIRD_PARTY_NOTICES can be merged on another Host.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-core/host-notices.txt
          if-no-files-found: error
      # A new environment, with the locked tools and the package from the wheel, so that the
      # tests load the library inside the installed package and import nothing from src/.
      - &install-the-wheel
        name: Install the wheel
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/wheel-env
          ENVIRONMENT_PYTHON: ${{ runner.temp }}/wheel-env/${{ matrix.environment-python }}
        run: |
          uv sync --no-install-project
          uv pip install --python "$ENVIRONMENT_PYTHON" "$RUNNER_TEMP"/dist/*.whl
      # The tests of the Page program run the one in the installed package. They spend most of their time waiting on
      # Pages and servers, so a worker per core runs them about three times as fast (docs/building.md, "In CI").
      - name: Test the installed wheel
        env:
          MITTO_HOST_NOTICES: ${{ runner.temp }}/native-core/host-notices.txt
          ENVIRONMENT_PYTHON: ${{ runner.temp }}/wheel-env/${{ matrix.environment-python }}
          PAGE_PROGRAM: ${{ matrix.page-program }}
        run: |
          MITTO_WHEEL="$(ls "$RUNNER_TEMP"/dist/*.whl)"
          MITTO_PAGE_PROGRAM="$("$ENVIRONMENT_PYTHON" -c 'import importlib.util, os, sys; print(os.path.join(importlib.util.find_spec("mitto").submodule_search_locations[0], sys.argv[1]))' "$PAGE_PROGRAM")"
          export MITTO_WHEEL MITTO_PAGE_PROGRAM
          "$ENVIRONMENT_PYTHON" -m pytest -rs -n auto
      # The tests that time something by the wall clock, which the workers above would hold up, and so skip.
      - name: Test what runs alone
        env:
          ENVIRONMENT_PYTHON: ${{ runner.temp }}/wheel-env/${{ matrix.environment-python }}
        run: |
          "$ENVIRONMENT_PYTHON" -m pytest -rs -m alone
      # The C test program opens Pages with the installed Page program beside the library, as the wheel holds them, and
      # kills the processes on each side. Only these tests run it here: the sanitizer builds run its other scenarios.
      - name: Test Pages through the C API
        env:
          ENVIRONMENT_PYTHON: ${{ runner.temp }}/wheel-env/${{ matrix.environment-python }}
          MITTO_CORE_TEST: ${{ runner.temp }}/native-core/${{ matrix.core-test }}
          PAGE_PROGRAM: ${{ matrix.page-program }}
        run: |
          MITTO_PAGE_PROGRAM="$("$ENVIRONMENT_PYTHON" -c 'import importlib.util, os, sys; print(os.path.join(importlib.util.find_spec("mitto").submodule_search_locations[0], sys.argv[1]))' "$PAGE_PROGRAM")"
          export MITTO_PAGE_PROGRAM
          "$ENVIRONMENT_PYTHON" -m pytest -rs tests/test_page_process.py
      # The last step, so that it passes only when every step before it did. A push that changes only the list of
      # differences finds the commit here, in what the Actions API says of the job (the job "changes" above).
      - &passed-on
        name: Passed on ${{ github.sha }}
        run: ":"

  native-macos:
    name: Native core on ${{ matrix.runner }}
    needs: changes
    if: *builds
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      matrix:
        include:
          # The one hosted macOS image with the macOS SDK that Chromium's bots use.
          - runner: xcode-27
            library: libmitto_core.dylib
            core-test: mitto_core_test
            page-program: mitto_page
            # One build step per core. With ninja's default of 5, the Runtime's build took 108 minutes rather than 83.
            runtime-jobs: 3
            html-tokenizer-test: html_tokenizer_test
            html-tree-builder-test: html_tree_builder_test
            media-query-test: media_query_test
            environment-python: bin/python
    env: *uv-locked
    defaults: *bash
    steps: *native-steps

  native-windows:
    name: Native core on ${{ matrix.runner }}
    needs: changes
    if: *builds
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      matrix:
        include:
          # Visual Studio 2026, which Chromium 157 asks for.
          - runner: windows-2025-vs2026
            library: mitto_core.dll
            # The debug information of the DLL and of the program, which the wheel's symbols archive holds.
            symbols: mitto_core.dll.pdb
            core-test: mitto_core_test.exe
            page-program: mitto_page.exe
            page-program-symbols: mitto_page.exe.pdb
            html-tokenizer-test: html_tokenizer_test.exe
            html-tree-builder-test: html_tree_builder_test.exe
            media-query-test: media_query_test.exe
            environment-python: Scripts/python.exe
    env: *uv-locked
    defaults: *bash
    steps: *native-steps

  # What takes the native jobs' place when a push changes only the list of differences: the same wheel, and the tests
  # that read the list, which run on the Host as in the native job. Like the native jobs, each has a matrix of one.
  reuse-linux:
    name: Native core on ${{ matrix.runner }}
    needs: changes
    if: &reuses ${{ needs.changes.outputs.run != '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions: &reads-artifacts
      actions: read
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            environment-python: bin/python
    env: *uv-locked
    defaults: *bash
    steps: &reuse-steps
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *setup-uv
      # The wheel that the native job of the run before built and tested.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(needs.changes.outputs.wheels)[matrix.runner] }}
          path: ${{ runner.temp }}/dist
          run-id: ${{ needs.changes.outputs.run }}
          github-token: ${{ github.token }}
      - *install-the-wheel
      # The only tests that read the list. Every other test came out as it did in the run before: nothing that it reads
      # has changed.
      - name: Test what reads the list of differences
        env:
          ENVIRONMENT_PYTHON: ${{ runner.temp }}/wheel-env/${{ matrix.environment-python }}
        run: |
          "$ENVIRONMENT_PYTHON" -m pytest -rs tests/test_wpt*.py
      # For the web-platform-tests of this run, and for the next push that changes only the list.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.runner }}
          path: ${{ runner.temp }}/dist/mitto-*
          if-no-files-found: error
          compression-level: 0
      - *passed-on

  reuse-macos:
    name: Native core on ${{ matrix.runner }}
    needs: changes
    if: *reuses
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions: *reads-artifacts
    strategy:
      matrix:
        include:
          - runner: xcode-27
            environment-python: bin/python
    env: *uv-locked
    defaults: *bash
    steps: *reuse-steps

  reuse-windows:
    name: Native core on ${{ matrix.runner }}
    needs: changes
    if: *reuses
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions: *reads-artifacts
    strategy:
      matrix:
        include:
          - runner: windows-2025-vs2026
            environment-python: Scripts/python.exe
    env: *uv-locked
    defaults: *bash
    steps: *reuse-steps

  wpt-linux:
    name: web-platform-tests on ${{ matrix.runner }}
    # From this Host's wheel, which its native job made or, for a push that changes only the list, its reuse job took.
    # So it waits for this Host's job alone, and runs only when that job passed. A draft pull request builds no wheel,
    # and runs this once it is marked ready for review.
    needs: [native-linux, reuse-linux]
    if: ${{ !cancelled() && (needs.native-linux.result == 'success' || needs.reuse-linux.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            environment-python: bin/python
    env: *uv-locked
    defaults: *bash
    steps: &wpt-steps
      # The copy of web-platform-tests holds files whose line endings a test checks.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *setup-uv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.runner }}
          path: ${{ runner.temp }}/dist
      # As the native job installs it, so that the Pages run the Page program of the installed package.
      - *install-the-wheel
      # Against Chrome's results and the list of differences in tests/wpt. docs/wpt.md says how to write the list from
      # the results that this keeps. Most Pages wait out a timeout with nothing to do, so 12 run at once on 4 cores.
      - name: Run web-platform-tests
        env:
          ENVIRONMENT_PYTHON: ${{ runner.temp }}/wheel-env/${{ matrix.environment-python }}
        run: |
          "$ENVIRONMENT_PYTHON" -m tools.wpt run --jobs 12 --results "$RUNNER_TEMP/wpt-results.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpt-results-${{ matrix.runner }}
          path: ${{ runner.temp }}/wpt-results.json
          if-no-files-found: ignore

  wpt-macos:
    name: web-platform-tests on ${{ matrix.runner }}
    needs: [native-macos, reuse-macos]
    if: ${{ !cancelled() && (needs.native-macos.result == 'success' || needs.reuse-macos.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: xcode-27
            environment-python: bin/python
    env: *uv-locked
    defaults: *bash
    steps: *wpt-steps

  wpt-windows:
    name: web-platform-tests on ${{ matrix.runner }}
    needs: [native-windows, reuse-windows]
    if: ${{ !cancelled() && (needs.native-windows.result == 'success' || needs.reuse-windows.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: windows-2025-vs2026
            environment-python: Scripts/python.exe
    env: *uv-locked
    defaults: *bash
    steps: *wpt-steps
