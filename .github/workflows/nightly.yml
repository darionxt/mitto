name: Nightly

# main reuses its build directories, so a mistake in an incremental build would not show there. This run builds what
# main holds from nothing on every Host, with CI's and the sanitizers' jobs and tests, once main has moved since the last
# run that passed.
on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this commit has passed a run already
        type: boolean
        default: false

permissions:
  contents: read

# A run started while another runs waits for it, and then finds its commit checked.
concurrency:
  group: nightly-${{ github.ref }}

jobs:
  moved:
    name: Has main moved
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      build: ${{ steps.compare.outputs.build }}
      since: ${{ steps.compare.outputs.since }}
    steps:
      # A run whose builds were skipped passes too, with the commit that the last build passed with.
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          since="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=$GITHUB_REF_NAME&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
          echo "since=$since" >> "$GITHUB_OUTPUT"
          if [ -z "$since" ]; then
            echo "No run on $GITHUB_REF_NAME has passed yet, so this one builds $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$since" != "$GITHUB_SHA" ]; then
            echo "This run builds what merged since the last run that passed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$since...$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" = "true" ]; then
            echo "$GITHUB_SHA passed the last run, and this one builds it again because it was asked to." >> "$GITHUB_STEP_SUMMARY"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "$GITHUB_SHA passed the last run, so this one builds nothing." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: moved
    if: needs.moved.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      from-nothing: true

  sanitizers:
    name: Sanitizers
    needs: moved
    if: needs.moved.outputs.build == 'true'
    uses: ./.github/workflows/sanitizers.yml
    with:
      from-nothing: true
