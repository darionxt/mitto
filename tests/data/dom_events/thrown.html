<!doctype html><title>thrown</title><script>
function done(result) { window.result = result; fetch('/record', {method: 'POST', body: JSON.stringify(result)}); }
// What the window's error event says of what is thrown that is not an error. V8's message reads only an object's data
// properties, but reports what a callback or a classic script threw with its toString(), and so says the name and
// message of a DOMException, whose are accessors. What reportError() gets or a module's evaluation throws gets no more
// than V8 reads.
const log = [];
window.addEventListener('error', (e) => log.push(e.message));
class Getters { get name() { log.push('name read'); return 'Named'; } get message() { return 'by getters'; } }
Object.setPrototypeOf(Getters.prototype, Error.prototype);
reportError(new DOMException('reported', 'TypeError'));
reportError({toString() { return 'reported toString'; }});
reportError(new DOMException());
reportError(new DOMException('reported with no name', ''));
setTimeout(() => { throw new DOMException('from a timer', 'TypeError'); });
setTimeout(() => { document.querySelector('!'); });
setTimeout(() => { throw new DOMException(); });
setTimeout(() => { throw new DOMException('thrown with no name', ''); });
setTimeout(() => { throw new Getters(); });
setTimeout(() => { throw Object.create(DOMException.prototype); });
setTimeout(() => { throw {toString() { return 'its own toString'; }}; });
// The rest one after another, so that a busy machine keeps their order: a frame, then a classic script, then a module
// script, whose error ends the page's cases.
window.addEventListener('error', () => {
  if (window.moduleThrew) setTimeout(() => done(log), 0);
});
setTimeout(() => requestAnimationFrame(() => {
  setTimeout(() => {
    const classic = document.createElement('script');
    classic.textContent = "throw new DOMException('from a classic script', 'TypeError');";
    document.body.append(classic);
    const module = document.createElement('script');
    module.type = 'module';
    module.textContent = "window.moduleThrew = true; throw new DOMException('from a module script', 'TypeError');";
    document.body.append(module);
  });
  throw new DOMException('from a frame', 'TypeError');
}), 20);
</script><body>
